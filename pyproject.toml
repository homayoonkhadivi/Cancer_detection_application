[project]
name = "cancer-detection"
version = "0.1.0"
description = "Pneumonia detection from chest X-rays using CNN and ResNet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy<2",
    "Pillow>=10.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
training = [
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
